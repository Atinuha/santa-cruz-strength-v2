ices" data-testid="analytics-consent-control"><p><strong>Optional measurement is off.</strong> Choose whether analytics or advertising measurement may run.</p><div><button type="button" class="scs-consent-keep">Keep off</button><button type="button" class="scs-consent-review">Review choices</button></div></aside></div><script id="scs-preload">window.__SCS_PRELOAD__={"content":{"about_mission":"Rooted in strength. Built with heart.","about_team_subtitle":"The people behind the iron","about_trainers_headline":"MEET OUR TRAINERS","about_trainers_subtitle":"Expert coaching for every level","about_headline":"THIS IS SANTA CRUZ STRENGTH","about_story":"Santa Cruz Strength has been part of this community for over 13 years.\n\nWe were originally built as a space for powerlifting, strongman, and Olympic weightlifting. It was a place for strength athletes deeply committed to their training who wanted to take it seriously.\n\nThat foundation still matters. It shaped how we train, the equipment we use, and the respect we have for strength as a practice.\n\nOver time, the gym became more than a place to train. People stayed, built relationships, and supported each other. For many, it became a space where they found a sense of belonging they hadn’t experienced in other gyms.\n\nAs the community evolved, so did the space.\n\nToday, Santa Cruz Strength is a place where you can train hard and get stronger, whether you’re experienced or just getting started.\n\nWe welcome people across all levels of experience, and we’re proud that our community includes a strong base of women and queer members.\n\nYou’ll find people here lifting heavy and training consistently, as well as people learning, returning, or building a new relationship with movement. All belong here.\n\nThis gym has always been about strength. Now, it’s also about making that strength more accessible.","about_team_headline":"MEET THE TEAM","about_cta_headline":"COME SEE FOR YOURSELF","about_cta_text":"Come by, take a look around, and meet the crew. Good people, a supportive space, and a chance to get a feel for it.","home_hero_headline":"REAL STRENGTH.\nREAL PEOPLE.","home_hero_subtitle":"Strength looks different for everyone.","home_hero_subtext":"You don’t have to be a “serious lifter” to belong here. No matter your goals, you belong at Santa Cruz Strength. ","home_benefits_headline":"STRENGTH FOR EVERYONE.","home_benefits_subtitle":"Santa Cruz Strength is a community-centered gym where you can build strength, move your body, and feel more at home in yourself. ","home_environment_headline":"WHAT TRAINING\nHERE FEELS LIKE","home_environment_text":"Most people come to build strength and stay because of how it feels to be here. We’ve built a space that prioritizes respect, focus without pressure, and a sense of belonging. ","home_environment_subtext":"You can train hard here. You can also take your time. All are welcome.","home_who_headline":"IF YOU HAVE A BODY,\nYOU BELONG HERE.","home_who_text":"There’s no single type of person who joins Santa Cruz Strength, just the common thread of resistance training.","home_who_subtext":"We are a queer-friendly space, and we are committed to creating an environment where all identities are respected.","training_headline":"PERSONAL TRAINING\nTHAT MEETS YOUR NEEDS.","training_subtitle":"Work directly with a Santa Cruz Strength coach to build real strength, master technique, and train with purpose.","training_cta_headline":"READY TO TRAIN WITH PURPOSE?","contact_headline":"CONTACT US","contact_subtitle":"Questions, tour requests, or just want to know more.","contact_form_headline":"REACH OUT","contact_form_subtitle":"Fill out the form and we will get back to you within 24 hours.","home_hero_headline_v2":"A Santa Cruz strength gym you can see before you join.","home_hero_subtitle_v2":"See the racks, platforms, training floor, and access setup before you choose a membership.","home_definition_headline":"What Santa Cruz Strength is","home_definition_body_1":"Santa Cruz Strength is an independent strength training gym at 151 Harvey West Blvd, Suite D, in Santa Cruz, California. The floor supports barbell training, powerlifting and general strength work, with racks, bars, platforms and open gym space.","home_definition_body_2":"Personal training is available for lifters who want technique coaching, structured programming, or help getting started. Membership options include day passes, monthly plans and longer-term memberships.","home_definition_access":""}}</script>
